name: nginx-ci-cd

on:
  push:
    branches: [develop]
    tags: ["v*"]
    paths:
      - "prueba_3/index.html"
      - "prueba_3/nginx.conf"
      - "prueba_3/Dockerfile"
      - "prueba_3/docker-compose.yml"
      - "prueba_3/scripts/deploy.sh"
      - ".github/workflows/nginx-cicd.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: nginx-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nginx

jobs:
  build:
    runs-on: self-hosted
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image reference
        id: image
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="sha-${GITHUB_SHA::12}"
          fi
          image_ref="${REGISTRY}/${IMAGE_NAME}:${tag}"
          echo "ref=${image_ref,,}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./prueba_3
          push: true
          tags: ${{ steps.image.outputs.ref }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, linux, staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy and verify staging
        working-directory: prueba_3
        run: ./scripts/deploy.sh staging "${{ needs.build.outputs.image_ref }}" 8081

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, linux, production]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy and verify production
        working-directory: prueba_3
        run: ./scripts/deploy.sh production "${{ needs.build.outputs.image_ref }}" 8082
